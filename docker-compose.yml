services:
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql

    app:
        build: .
        ports:
            - "3000:3000"
        environment:
            DATABASE_URL: ${DATABASE_URL}
        depends_on:
            - postgres

volumes:
    postgres_data:
