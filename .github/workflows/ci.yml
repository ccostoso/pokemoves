name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:latest
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: pokemoves_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d pokemoves_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemoves_test?schema=public
            # Build-only placeholders: never used to send email or authenticate real users in CI
            BETTER_AUTH_SECRET: ci-placeholder-secret
            BETTER_AUTH_URL: http://localhost:3000
            RESEND_API_KEY: ci-placeholder-key
            RESEND_FROM_EMAIL: test@example.com

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Type check
              run: pnpm typecheck

            - name: Unit tests
              run: pnpm test

            - name: Integration tests
              run: pnpm test:integration

            - name: Build
              run: pnpm build
